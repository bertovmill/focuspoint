<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cael</title>
<style>
  :root { color-scheme: light dark; --bg: #f9f9f9; --fg: #111; --muted: #777; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #eee; --muted: #888; } }
  body { margin: 0; height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px -apple-system, system-ui, sans-serif; text-align: center; }
  p { color: var(--muted); margin: 6px 0 20px; }
  button { font: inherit; padding: 10px 20px; border-radius: 10px; border: 0; background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
  <div>
    <strong>Cael is offline</strong>
    <p>Can't reach cael.bertomill.com right now.</p>
    <button onclick="location.href='https://cael.bertomill.com'">Try again</button>
  </div>
</body>
</html>
