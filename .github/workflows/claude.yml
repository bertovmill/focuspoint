# Claude Code on GitHub: the builder behind Cael's `request_feature` tool. Cael opens
# an issue that mentions @claude; this picks it up, implements it on a branch and opens
# a pull request for Berto to review. Mentioning @claude in an issue or PR comment
# works too (follow-ups, "fix the typecheck error", review changes).
#
# One-time setup: install the Claude GitHub app on bertovmill/focuspoint and add a
# CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`) — or ANTHROPIC_API_KEY.
name: Claude Code

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only Berto's accounts start a run (Cael files issues with his token, so it counts).
    if: |
      contains(fromJSON('["bertovmill","rmillaucctus"]'), github.actor) && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools "Bash(npm run typecheck),Bash(npm run build),Bash(git:*)"
