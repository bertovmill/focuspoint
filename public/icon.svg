<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Tile: the app's dark-mode card colour, not pure black, so the icon still
         reads as a tile against a black home screen or a dark browser tab. -->
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14100f"/>
      <stop offset="100%" stop-color="#080807"/>
    </linearGradient>

    <!-- Cael's orb: a plain green sphere, lit from the top left. -->
    <radialGradient id="orb" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0%" stop-color="#7fd9a0"/>
      <stop offset="52%" stop-color="#3fae6c"/>
      <stop offset="100%" stop-color="#1f6b40"/>
    </radialGradient>

    <!-- Halo. A feathered radial, not stacked discs: two flat circles leave a
         visible step on a 512px render even at 7% opacity. -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3fae6c" stop-opacity="0.16"/>
      <stop offset="62%" stop-color="#3fae6c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fae6c" stop-opacity="0"/>
    </radialGradient>

    <!-- Gloss across the top of the orb, feathered so it never shows an edge. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#tile)"/>

  <!-- Soft halo: the orb sitting in its own light, the way the avatar glows in chat. -->
  <circle cx="256" cy="256" r="204" fill="url(#halo)"/>

  <circle cx="256" cy="256" r="140" fill="url(#orb)"/>
  <ellipse cx="222" cy="188" rx="86" ry="52" fill="url(#gloss)"/>
</svg>
